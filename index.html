  siguiente() {
    const i = Math.min(Guardado.datos.desbloqueados, NIVELES.length) - 1;
    const reg = Guardado.datos.niveles[NIVELES[i].id];
    return (reg && reg.completado > 0) ? -1 : i;
  },

  abrir(op) {
    op = op || {};
    this.viajando = false;
    UI.mostrar('p-mapa');
    UI.actualizarMonedas();
    $('#hudRacha').textContent = Math.max(1, Guardado.datos.dias.racha);
    this.distribuir();
    const d = Guardado.datos;
    const frases = [];
    if (!d.introVista) {
      frases.push('¡Hola! Soy Pipo. Viajo en mi cohete por los planetas de los números. ¡Toca el planeta que brilla para empezar!');
      d.introVista = true;
      Guardado.guardar();
    } else {
      if (op.dia && !op.dia.primeraVez) {
        frases.push('¡Qué alegría verte! Te regalo tres monedas por venir hoy.');
        if (op.dia.racha >= 2) frases.push('Llevas ' + numTexto(op.dia.racha) + ' días de aventura seguidos.');
        UI.aviso('🪙', '+' + MONEDAS_DIA);
        Sonido.efecto('moneda');
      }
      if (op.despertar !== undefined && op.despertar !== null) {
        frases.push('¡Se ha despertado un planeta nuevo! ¡Tócalo para jugar!');
        this.animarDespertar(op.despertar);
      } else {
        frases.push(op.texto || '¡Elige un planeta!');
      }
    }
    const nuevos = Logros.comprobar();
    nuevos.forEach(l => frases.push('¡Nueva medalla! ' + l.voz));
    Voz.instruccion = 'Toca un planeta para jugar. El que brilla es el siguiente.';
    Voz.decir(frases.join(' '));
  },

  /* Coloca los planetas en zigzag ajustándose al tamaño de la pantalla */
  distribuir() {
    const zona = $('#mapaZona');
    const W = zona.clientWidth, H = zona.clientHeight;
    if (!W || !H) return;
    const n = NIVELES.length;
    let mejor = null;
    [3, 4, 6].forEach(cols => {
      const filas = Math.ceil(n / cols);
      const cw = W / cols, ch = H / filas;
      const puntos = Math.abs(Math.log((cw / ch) / 1.2));
      if (!mejor || puntos < mejor.puntos) mejor = { cols: cols, filas: filas, cw: cw, ch: ch, puntos: puntos };
    });
    const cols = mejor.cols, cw = mejor.cw, ch = mejor.ch;
    const s = limitar(Math.min(cw, ch) * 0.6, 64, 136);
    this.s = s;
    this.cols = cols;
    const holgura = Math.max(0, Math.min(ch * 0.12, ch / 2 - s / 2 - 6));
    this.puntos = NIVELES.map((nv, i) => {
      const fila = Math.floor(i / cols);
      const k = i % cols;
      const col = fila % 2 === 0 ? k : cols - 1 - k;
      return { x: (col + 0.5) * cw, y: H - (fila + 0.5) * ch + Math.sin(i * 1.9) * holgura, col: col };
    });

    // Ruta punteada: completa (tenue) y recorrida (dorada)
    const hasta = Math.min(Guardado.datos.desbloqueados, n);
    const svg = $('#mapaRuta');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.innerHTML = '<path class="ruta-fondo" d="' + rutaSuave(this.puntos) + '"/>' +
      (hasta > 1 ? '<path class="ruta-hecha" d="' + rutaSuave(this.puntos.slice(0, hasta)) + '"/>' : '');

    // Planetas
    const cont = $('#mapaNodos');
    cont.innerHTML = '';
    const sig = this.siguiente();
    NIVELES.forEach((nv, i) => {
      const reg = Guardado.datos.niveles[nv.id];
      const abierto = this.desbloqueado(i);
      const hecho = reg && reg.completado > 0;
      const b = crear('button', 'planeta' + (abierto ? '' : ' bloqueado') + (hecho ? ' hecho' : '') + (i === sig ? ' actual' : ''));
      b.type = 'button';
      b.style.left = this.puntos[i].x + 'px';
      b.style.top = this.puntos[i].y + 'px';
      b.style.setProperty('--s', s + 'px');
      b.style.setProperty('--p1', nv.p1);
      b.style.setProperty('--p2', nv.p2);
      b.setAttribute('aria-label', 'Planeta ' + (i + 1) + ': ' + nv.nombre + (abierto ? '' : ' (dormido)'));
      b.innerHTML = '<span class="planeta-cuerpo"><span class="planeta-icono' + (nv.emo ? ' emo' : '') + '">' + nv.icono + '</span></span>' +
        (nv.anillo ? '<span class="planeta-anillo"></span>' : '') +
        '<span class="planeta-num">' + (i + 1) + '</span>' +
        (!abierto ? '<span class="planeta-insignia candado">' + ICONOS.candado + '</span>' :
          hecho ? '<span class="planeta-insignia">' + ICONOS.estrella + '</span>' : '');
      b.addEventListener('click', () => this.tocar(i, b));
      cont.appendChild(b);
    });

    // Pipo junto al planeta donde está
    let donde = this.ultimo;
    if (donde === null || donde === undefined || !this.desbloqueado(donde)) donde = sig >= 0 ? sig : Math.min(Guardado.datos.desbloqueados, n) - 1;
    this.colocarPipo(donde, false);
  },

  colocarPipo(i, animado) {
    const pipo = $('#pipoMapa');
    const p = this.puntos[i];
    if (!p) return;
    const s = this.s;
    const lado = p.col === this.cols - 1 ? -1 : 1;
    if (!animado) pipo.style.transition = 'none';
    pipo.style.setProperty('--pw', (s * 0.78) + 'px');
    pipo.style.transform = 'translate(-50%, -100%)';
    pipo.style.left = (p.x + lado * s * 0.62) + 'px';
    pipo.style.top = (p.y + s * 0.44) + 'px';
    if (!animado) { void pipo.offsetWidth; pipo.style.transition = ''; }
  },

  tocar(i, boton) {
    if (this.viajando) return;
    if (!this.desbloqueado(i)) {
      Sonido.efecto('suave');
      boton.classList.remove('dormido-toque');
      void boton.offsetWidth;
      boton.classList.add('dormido-toque');
      Voz.decir('Ese planeta todavía está dormido. ¡Primero visita el planeta que brilla!');
      return;
    }
    this.viajando = true;
    Voz.callar();
    Sonido.efecto('cohete');
    this.colocarPipo(i, true);
    this.ultimo = i;
    setTimeout(() => {
      this.viajando = false;
      Juego.empezar(i);
    }, REDUCIR_MOVIMIENTO ? 150 : 800);
  },

  animarDespertar(i) {
    const nodos = $$('#mapaNodos .planeta');
    const b = nodos[i];
    if (!b) return;
    b.classList.add('despierta');
    setTimeout(() => {
      Sonido.efecto('desbloquear');
      const c = UI.centro(b);
      Confeti.lanzar(c.x, c.y, 40, false);
    }, 300);
  }
};

/* =========================================================
   9. MOTOR DEL JUEGO, DIBUJO DE ESCENAS Y PISTAS
   - Cada planeta: 6 aciertos = 6 estrellas.
   - 3 aciertos seguidos a la primera -> sube la dificultad.
   - Un fallo -> baja la dificultad (para la siguiente) y pista.
   - Los errores nunca quitan nada: solo ayudan.
   ========================================================= */
const Sesion = {
  ms: 0,           // tiempo de juego acumulado desde el último descanso
  reiniciar() { this.ms = 0; }
};

/* ----- Dibujo de escenas ----- */
const Render = {
  conteo: 0,   // cuántos objetos ha contado el niño tocando

  limpiar() {
    $('#escena').innerHTML = '';
    $('#respuestas').innerHTML = '';
    this.conteo = 0;
  },

  /* Botón de respuesta con un número */
  botonNumero(valor) {
    const b = crear('button', 'btn opcion elegible', '<span>' + valor + '</span>');
    b.type = 'button';
    b.dataset.valor = String(valor);
    b.setAttribute('aria-label', numTexto(valor));
    b.addEventListener('click', () => Juego.responder(String(valor), b));
    return b;
  },

  /* Botón de respuesta con un dibujo (emoji) */
  botonEmoji(valor, emoji, nombre) {
    const b = crear('button', 'btn opcion elegible', '<span class="emo">' + emoji + '</span>');
    b.type = 'button';
    b.dataset.valor = String(valor);
    b.setAttribute('aria-label', nombre || String(valor));
    b.addEventListener('click', () => Juego.responder(String(valor), b));
    return b;
  },

  /* Carta grande dentro de la escena (números, formas, grupos) */
  carta(valor, html, nombre) {
    const b = crear('button', 'btn opcion carta elegible', html);
    b.type = 'button';
    b.dataset.valor = String(valor);
    b.setAttribute('aria-label', nombre || String(valor));
    b.addEventListener('click', () => Juego.responder(String(valor), b));
    return b;
  },

  /* Contenedor de cartas que se ajusta al hueco */
  cartas(aspecto, maximo) {
    const c = crear('div', 'cartas');
    c.dataset.ajustar = 'cartas';
    c.dataset.aspecto = aspecto || 1;
    c.dataset.max = maximo || 210;
    return c;
  },

  /* Un objeto que se puede tocar para contarlo */
  objeto(emoji, nombre, contable) {
    const b = crear(contable ? 'button' : 'span', 'obj' + (contable ? '' : ' no-contable'), '<span class="obj-e">' + emoji + '</span><span class="obj-num"></span>');
    if (contable) {
      b.type = 'button';
      b.setAttribute('aria-label', nombre || 'objeto');
      b.addEventListener('click', () => this.tocarObjeto(b));
    } else {
      b.setAttribute('aria-hidden', 'true');
    }
    return b;
  },

  /* Rejilla de objetos. op: { contable, disperso, nombre } */
  rejilla(emojis, op) {
    op = op || {};
    const r = crear('div', 'rejilla');
    r.dataset.ajustar = 'rejilla';
    const objs = emojis.map(e => this.objeto(e, op.nombre, op.contable !== false));
    if (op.disperso) {
      // Más huecos que objetos, con pequeños giros: cuesta un poco más contar
      const huecos = Math.ceil(emojis.length * 1.6);
      const sitios = barajar(Array.from({ length: huecos }, (v, i) => i)).slice(0, emojis.length).sort((a, b) => a - b);
      let k = 0;
      for (let i = 0; i < huecos; i++) {
        if (sitios.indexOf(i) >= 0) {
          const o = objs[k++];
          const e = o.querySelector('.obj-e');
          e.style.setProperty('--dx', azar(-14, 14) + '%');
          e.style.setProperty('--dy', azar(-14, 14) + '%');
          e.style.setProperty('--rot', azar(-16, 16) + 'deg');
          r.appendChild(o);
        } else {
          r.appendChild(crear('span', 'hueco-vacio'));
        }
      }
    } else {
      objs.forEach(o => r.appendChild(o));
    }
    return r;
  },

  /* El niño toca un objeto: se marca con su número y Pipo lo dice */
  tocarObjeto(b) {
    if (b.classList.contains('se-va') || Pistas.contando) return;
    let n = Number(b.dataset.n || 0);
    if (!n) {
      this.conteo++;
      n = this.conteo;
      this.marcar(b, n);
    }
    b.classList.remove('rebote');
    void b.offsetWidth;
    b.classList.add('rebote');
    Sonido.efecto('contar', n);
    Voz.decir(capitalizar(numTexto(n)));
  },

  marcar(b, n) {
    b.dataset.n = String(n);
    b.classList.add('contado');
    const num = b.querySelector('.obj-num');
    if (num) num.textContent = n;
  },

  desmarcar(b) {
    delete b.dataset.n;
    b.classList.remove('contado');
  },

  /* Recalcula los tamaños de todo lo que hay en la escena */
  ajustar() {
    $$('#escena [data-ajustar]').forEach(el => {
      const tipo = el.dataset.ajustar;
      const W = el.clientWidth, H = el.clientHeight;
      if (!W || !H) return;
      if (tipo === 'rejilla') {
        const n = el.children.length;
        const hueco = 6;
        const m = medirRejilla(W, H, n, 1, hueco);
        const lado = Math.min(m.alto, 150);
        el.style.setProperty('--cols', m.cols);
        el.style.setProperty('--cw', lado + 'px');
        el.style.setProperty('--ch', lado + 'px');
        el.style.setProperty('--g', hueco + 'px');
      } else if (tipo === 'cartas') {
        const n = el.children.length;
        const aspecto = Number(el.dataset.aspecto) || 1;
        const hueco = limitar(Math.min(W, H) * 0.05, 8, 20);
        const m = medirRejilla(W, H, n, aspecto, hueco);
        const alto = Math.min(m.alto, Number(el.dataset.max) || 210);
        el.style.setProperty('--cols', m.cols);
        el.style.setProperty('--ch', alto + 'px');
        el.style.setProperty('--cw', (alto * aspecto) + 'px');
        el.style.setProperty('--g', hueco + 'px');
      } else if (tipo === 'tren') {
        // Locomotora (0,9 s) + vagones (s) + huecos (0,1 s): todo en una fila
        const vagones = el.children.length - 1;
        const s = Math.min((W - 6) / (0.9 + 1.1 * vagones), H * 0.62, 130);
        el.style.setProperty('--s', s + 'px');
      } else if (tipo === 'fila') {
        // Un patrón se lee en fila: una sola fila si cabe con buen tamaño; si no, dos
        const n = el.children.length;
        const enUna = Math.min((W - 4) / (n + 0.12 * (n - 1)), H * 0.8, 120);
        const cols = Math.ceil(n / 2);
        const enDos = Math.min((W - 4) / (cols + 0.12 * (cols - 1)), (H - 8) / 2.12, 120);
        const usarUna = enUna >= 54 || enUna >= enDos;
        const s = usarUna ? enUna : enDos;
        const c = usarUna ? n : cols;
        el.style.setProperty('--s', s + 'px');
        el.style.maxWidth = (c * s + (c - 1) * s * 0.12 + 3) + 'px';
      } else if (tipo === 'marcos') {
        const marcos = el.children.length;
        const s = Math.min((W - 8) / 5, (H - 10) / (marcos * 2 + (marcos - 1) * 0.3), 130);
        el.style.setProperty('--s', s + 'px');
      }
    });
  }
};

/* ----- Pistas visuales y habladas ----- */
const Pistas = {
  contando: false,
  vivo(tk) { return tk === Juego.token; },

  /* Contamos juntos: se marcan los objetos uno a uno mientras Pipo cuenta */
  async contar(tk, objs, op) {
    this.contando = true;
    try {
      await this.contarJuntos(tk, objs, op);
    } finally {
      this.contando = false;
    }
  },

  async contarJuntos(tk, objs, op) {
    op = op || {};
    await Voz.decir(op.intro || elegir(ANIMOS));
    if (!this.vivo(tk)) return;
    objs.forEach(o => Render.desmarcar(o));
    if (op.previos) op.previos.forEach(o => Render.desmarcar(o));
    let n = 0;
    if (op.previos && op.previos.length) {
      // Primer marco de diez: se marca de golpe
      op.previos.forEach((o, k) => Render.marcar(o, k + 1));
      n = op.previos.length;
      if (op.marcoPrevio) op.marcoPrevio.classList.add('leyendo');
      await Voz.decir(op.textoPrevio || 'Aquí hay diez.');
      if (op.marcoPrevio) op.marcoPrevio.classList.remove('leyendo');
      if (!this.vivo(tk)) return;
    }
    for (let i = 0; i < objs.length; i++) {
      n++;
      Render.marcar(objs[i], n);
      objs[i].classList.remove('rebote');
      void objs[i].offsetWidth;
      objs[i].classList.add('rebote');
      Sonido.efecto('contar', n);
      const t0 = Date.now();
      await Promise.race([Voz.decir(capitalizar(numTexto(n))), esperar(1500)]);
      if (!this.vivo(tk)) return;
      const pasado = Date.now() - t0;
      if (pasado < 550) await esperar(550 - pasado);
      if (!this.vivo(tk)) return;
    }
    Render.conteo = Math.max(Render.conteo, n);
    await Voz.decir(op.cierre || 'El último número que decimos es cuántos hay. ¡Toca la respuesta!');
  },

  /* Lee en voz alta una serie de elementos, resaltando cada uno */
  async leer(tk, pasos, cierre, intro) {
    await Voz.decir(intro || elegir(ANIMOS));
    if (!this.vivo(tk)) return;
    for (let i = 0; i < pasos.length; i++) {
      const p = pasos[i];
      if (p.el) p.el.classList.add('leyendo');
      await Promise.race([Voz.decir(p.texto), esperar(2200)]);
      if (p.el) p.el.classList.remove('leyendo');
      if (!this.vivo(tk)) return;
      await esperar(120);
      if (!this.vivo(tk)) return;
    }
    if (cierre) await Voz.decir(cierre);
  },

  /* Tira de ayuda en la parte de arriba de la escena */
  tira(html) {
    const escena = $('#escena');
    let t = $('.pista-tira', escena);
    if (!t) {
      t = crear('div', 'pista-tira');
      escena.insertBefore(t, escena.firstChild);
    }
    t.innerHTML = html;
    Render.ajustar();
    return t;
  },

  /* Quita de la escena una opción incorrecta que aún esté disponible */
  quitarUna() {
    const q = Juego.estado.pregunta;
    const vivas = $$('#p-juego .elegible').filter(b => !b.classList.contains('apagado') && b.dataset.valor !== String(q.respuesta));
    if (vivas.length > 1) {
      const b = elegir(vivas);
      b.classList.add('apagado');
      b.disabled = true;
    }
  }
};

/* ----- Motor del juego ----- */
const Juego = {
  idx: 0,
  nivel: null,
  estado: null,
  token: 0,          // cambia en cada pregunta: las pistas en marcha se detienen solas
  bloqueado: false,
  pausado: false,
  tInicio: 0,
  tPausa: 0,
  msPausa: 0,

  empezar(idx) {
    this.idx = idx;
    this.nivel = NIVELES[idx];
    const reg = Guardado.nivel(this.nivel.id);
    this.estado = { aciertos: 0, seguidas: 0, dif: limitar(reg.dif || 0, 0, DIFICULTAD_MAX), fallos: 0, firmas: [], pregunta: null };
    this.pausado = false;
    this.tInicio = Date.now();
    this.msPausa = 0;
    Guardado.datos.stats.partidas++;
    const pj = $('#p-juego');
    pj.style.setProperty('--tema', this.nivel.p2);
    UI.mostrar('p-juego');
    this.pintarProgreso();
    this.nuevaPregunta(true);
  },

  pintarProgreso() {
    const cont = $('#progreso');
    cont.innerHTML = '';
    for (let i = 0; i < ACIERTOS_POR_PLANETA; i++) {
      const s = crear('span', 'estrella-slot' + (i < this.estado.aciertos ? ' llena' : ''), SVG_ESTRELLA);
      cont.appendChild(s);
    }
    cont.setAttribute('aria-label', this.estado.aciertos + ' de ' + ACIERTOS_POR_PLANETA + ' estrellas');
  },

  /* Genera y muestra una pregunta nueva sin repetir las últimas */
  nuevaPregunta(conIntro) {
    this.token++;
    const tk = this.token;
    const e = this.estado;
    const tipo = this.nivel.tipo === 'mezcla' ? elegir(TIPOS_MEZCLA) : this.nivel.tipo;
    const cfg = this.cfgDe(tipo);
    let q = null;
    for (let intento = 0; intento < 15; intento++) {
      q = GENERADORES[tipo](e.dif, cfg);
      if (e.firmas.indexOf(q.firma) < 0) break;
    }
    e.firmas.push(q.firma);
    if (e.firmas.length > 5) e.firmas.shift();
    e.pregunta = q;
    e.fallos = 0;
    this.bloqueado = false;

    Render.limpiar();
    const pj = $('#p-juego');
    pj.classList.toggle('sin-respuestas', !!q.sinRespuestas);
    q.pintar($('#escena'), $('#respuestas'));
    Render.ajustar();
    requestAnimationFrame(() => Render.ajustar());

    Voz.instruccion = q.textoRepetir || q.enunciado;
    if (conIntro) Voz.decir(this.nivel.intro);
    if (q.hablar) q.hablar(tk, conIntro);
    else Voz.decir(q.enunciado, { cola: conIntro });
  },

  /* Configuración del planeta que corresponde a un tipo (para la Galaxia Mágica) */
  cfgDe(tipo) {
    if (this.nivel.tipo === tipo) return this.nivel.cfg;
    const n = NIVELES.filter(x => x.tipo === tipo);
    return n.length ? n[n.length - 1].cfg : {};
  },

  responder(valor, boton) {
    if (this.bloqueado || this.pausado) return;
    const q = this.estado.pregunta;
    if (String(valor) === String(q.respuesta)) this.acierto(boton);
    else this.fallo(boton);
  },

  acierto(boton) {
    this.bloqueado = true;
    this.token++;
    const tk = this.token;
    const e = this.estado;
    const q = e.pregunta;
    const d = Guardado.datos;
    const reg = Guardado.nivel(this.nivel.id);
    const primera = e.fallos === 0;

    d.stats.aciertos++;
    d.stats.intentos++;
    reg.aciertos++;
    reg.intentos++;
    if (primera) {
      d.stats.primera++;
      reg.primera++;
      d.stats.racha++;
      d.stats.mejorRacha = Math.max(d.stats.mejorRacha, d.stats.racha);
      e.seguidas++;
    } else {
      d.stats.racha = 0;
      e.seguidas = 0;
    }
    let sube = false;
    if (e.seguidas >= ACIERTOS_PARA_SUBIR && e.dif < DIFICULTAD_MAX) {
      e.dif++;
      e.seguidas = 0;
      sube = true;
    }
    reg.dif = e.dif;
    d.monedas += MONEDAS_ACIERTO;
    e.aciertos++;
    Guardado.guardar();

    // Celebración inmediata
    $$('#p-juego .elegible.guiado').forEach(b => b.classList.remove('guiado'));
    if (boton) boton.classList.add('correcto');
    Sonido.efecto('acierto');
    Mascota.animar('feliz');
    const c = UI.centro(boton);
    Confeti.lanzar(c.x, c.y, 34, false);
    const hueco = $$('#progreso .estrella-slot')[e.aciertos - 1];
    UI.estrellaVuela(boton, hueco, () => {
      if (hueco) hueco.classList.add('llena');
      Sonido.efecto('estrella');
    });

    let frase = elegir(ELOGIOS) + ' ' + q.refuerzo;
    if (sube) frase += ' ¡Lo haces tan bien que vamos a probar algo un poquito más difícil!';
    else if (e.aciertos === Math.floor(ACIERTOS_POR_PLANETA / 2)) frase += ' ¡Ya llevas ' + numTexto(e.aciertos) + ' estrellas!';
    const nuevos = Logros.comprobar();
    nuevos.forEach(l => { frase += ' ¡Nueva medalla! ' + l.voz; });

    const habla = Promise.race([Voz.decir(frase), esperar(9000)]);
    Promise.all([habla, esperar(1500)]).then(() => {
      if (tk !== this.token || this.pausado) return;
      if (e.aciertos >= ACIERTOS_POR_PLANETA) this.terminar();
      else this.nuevaPregunta(false);
    });
  },

  fallo(boton) {
    const e = this.estado;
    const q = e.pregunta;
    const d = Guardado.datos;
    e.fallos++;
    e.seguidas = 0;
    d.stats.racha = 0;
    d.stats.intentos++;
    Guardado.nivel(this.nivel.id).intentos++;
    if (e.fallos === 1 && e.dif > 0) e.dif--;     // se aplica en la siguiente pregunta
    Guardado.nivel(this.nivel.id).dif = e.dif;
    Guardado.guardar();

    if (boton) {
      boton.classList.add('apagado');
      boton.disabled = true;
    }
    Sonido.efecto('suave');
    Mascota.animar('pensar');

    this.token++;
    const tk = this.token;
    const vivas = $$('#p-juego .elegible').filter(b => !b.classList.contains('apagado'));
    if (e.fallos >= 2 || vivas.length <= 1) {
      // Ya solo queda la buena (o es el segundo fallo): Pipo la señala
      if (e.fallos === 1 && q.pista) {
        q.pista(tk).then(() => { if (tk === this.token) this.guiar(); });
      } else {
        this.guiar();
        Voz.decir(elegir(GUIAS));
      }
    } else if (q.pista) {
      q.pista(tk);
    }
  },

  /* Resalta la respuesta correcta con un brillo suave */
  guiar() {
    const q = this.estado.pregunta;
    $$('#p-juego .elegible').forEach(b => {
      if (b.dataset.valor === String(q.respuesta)) b.classList.add('guiado');
      else if (!b.classList.contains('apagado')) { b.classList.add('apagado'); b.disabled = true; }
    });
  },

  terminar() {
    this.bloqueado = true;
    const d = Guardado.datos;
    const reg = Guardado.nivel(this.nivel.id);
    reg.completado++;
    reg.dif = this.estado.dif;
    let despertar = null;
    if (this.idx + 1 < NIVELES.length && d.desbloqueados < this.idx + 2) {
      d.desbloqueados = this.idx + 2;
      despertar = this.idx + 1;
    }
    const ms = Math.min(Date.now() - this.tInicio - this.msPausa, 12 * 60000);
    Sesion.ms += Math.max(0, ms);
    d.stats.minutos += Math.max(0, ms) / 60000;
    Guardado.guardar();
    Premio.abrir(this.idx, despertar);
  },

  pausar() {
    if (this.pausado || UI.pantalla !== 'p-juego') return;
    this.pausado = true;
    this.tPausa = Date.now();
    this.token++;
    Voz.callar();
    Pausa.abrir();
  },

  reanudar() {
    if (!this.pausado) return;
    this.pausado = false;
    this.msPausa += Date.now() - this.tPausa;
    const e = this.estado;
    if (this.bloqueado) {
      // Estaba celebrando un acierto: seguimos con la siguiente
      if (e.aciertos >= ACIERTOS_POR_PLANETA) this.terminar(); else this.nuevaPregunta(false);
      return;
    }
    this.token++;
    Voz.decir(Voz.instruccion);
  },

  salir() {
    this.pausado = false;
    this.token++;
    this.bloqueado = true;
    Voz.callar();
    const ms = Math.min(Date.now() - this.tInicio - this.msPausa, 12 * 60000);
    Sesion.ms += Math.max(0, ms);
    Guardado.datos.stats.minutos += Math.max(0, ms) / 60000;
    Guardado.guardar();
    Mapa.abrir({ texto: '¡Elige un planeta!' });
  }
};

/* =========================================================
   10. GENERADORES DE PREGUNTAS
   Cada generador recibe la dificultad (0, 1 o 2) y devuelve:
   { firma, respuesta, enunciado, refuerzo, pintar(), pista(), ... }
   ========================================================= */
const rango = (a, b) => { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; };

/* Números que los peques suelen confundir */
const CONFUSOS = { 6: 9, 9: 6, 2: 5, 5: 2, 1: 7, 7: 1, 3: 8, 8: 3 };

/* Posiciones de "dado" para reconocer cantidades de un vistazo */
const DADO = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
function dadoHTML(n, emoji) {
  let h;
  if (n <= 6) {
    h = '<span class="dado" style="--dc:3;--df:3;--de:.24">';
    for (let i = 0; i < 9; i++) h += '<span>' + (DADO[n].indexOf(i) >= 0 ? emoji : '') + '</span>';
  } else {
    h = '<span class="dado" style="--dc:5;--df:2;--de:.17">';
    for (let i = 0; i < 10; i++) h += '<span>' + (i < n ? emoji : '') + '</span>';
  }
  return h + '</span>';
}

/* "Toca el número N" entre varias cartas */
function genTocaNumero(min, max, cuantas, conPuntos, confusos) {
  const n = azar(min, max);
  let opciones = [n];
  const pareja = CONFUSOS[n];
  if (confusos && pareja && pareja >= min && pareja <= max) opciones.push(pareja);
  const resto = barajar(rango(min, max).filter(v => opciones.indexOf(v) < 0));
  while (opciones.length < cuantas && resto.length) opciones.push(resto.shift());
  opciones = barajar(opciones);
  const grande = n > 10;
  return {
    firma: 'n' + n + '-' + opciones.join(','),
    respuesta: n,
    sinRespuestas: true,
    enunciado: 'Toca el número ' + numTexto(n) + '.',
    refuerzo: grande ? 'Este es el ' + numTexto(n) + ': diez y ' + numTexto(n - 10) + '.' : 'Este es el ' + numTexto(n) + '.',
    pintar(esc) {
      const zona = crear('div', 'zona');
      const c = Render.cartas(0.82, 260);
      opciones.forEach(v => c.appendChild(Render.carta(v, '<span>' + v + '</span>' + (conPuntos && v <= 10 ? puntosHTML(v) : ''), numTexto(v))));
      zona.appendChild(c);
      esc.appendChild(zona);
    },
    pista() {
      Pistas.quitarUna();
      if (grande) {
        const u = n - 10;
        const como = n === 20 ? 'un dos y un cero' : (n === 11 ? 'dos unos' : 'un uno y un ' + numTexto(u));
        Pistas.tira('<span>' + n + '</span>' + miniMarcoHTML(10) + miniMarcoHTML(u));
        return Voz.decir(elegir(ANIMOS) + ' El ' + numTexto(n) + ' es diez y ' + numTexto(u) + ' más. Se escribe con ' + como + '.');
      }
      // Aparecen los puntitos debajo de cada número
      $$('#escena .carta').forEach(b => {
        if (!b.querySelector('.puntos')) b.insertAdjacentHTML('beforeend', puntosHTML(Number(b.dataset.valor)));
      });
      return Voz.decir(elegir(ANIMOS) + ' Mira los puntitos: el ' + numTexto(n) + ' tiene ' + numTexto(n) + (n === 1 ? ' puntito.' : ' puntitos.'));
    }
  };
}

/* "Este es el número N. ¿Dónde hay N cosas?" */
function genGrupoNumero(dif) {
  const max = [5, 8, 10][dif];
  const n = azar(1, max);
  const obj = elegir(OBJETOS);
  const otros = barajar(rango(1, max).filter(v => v !== n && (dif < 2 || Math.abs(v - n) <= 3)));
  const opciones = barajar([n, otros[0], otros[1]]);
  return {
    firma: 'g' + n + obj.e,
    respuesta: n,
    sinRespuestas: true,
    enunciado: 'Este es el número ' + numTexto(n) + '. ¿Dónde hay ' + cantidad(n, obj) + '?',
    refuerzo: 'Ahí hay ' + cantidad(n, obj) + '.',
    pintar(esc) {
      const caja = crear('div', 'numeros-b');
      caja.appendChild(crear('div', 'numero-grande', String(n)));
      const zona = crear('div', 'zona');
      const c = Render.cartas(1.25, 240);
      opciones.forEach(v => c.appendChild(Render.carta(v, dadoHTML(v, obj.e), cantidad(v, obj))));
      zona.appendChild(c);
      caja.appendChild(zona);
      esc.appendChild(caja);
    },
    pista() {
      Pistas.tira('<span>' + n + '</span><span>=</span>' + puntosHTML(n));
      Pistas.quitarUna();
      const lista = rango(1, n).map(numTexto).join(', ');
      return Voz.decir(elegir(ANIMOS) + ' El ' + numTexto(n) + ' es así: ' + lista + '. Busca el grupo que tiene ' + numTexto(n) + '.');
    }
  };
}

const GENERADORES = {
  /* ----- Contar objetos ----- */
  contar(dif, cfg) {
    const r = (cfg.rangos || [[1, 3], [2, 5], [3, 5]])[dif];
    const n = azar(r[0], r[1]);
    const obj = elegir(OBJETOS);
    const opciones = opcionesCercanas(n, 1, cfg.max || 10, 3);
    const consejo = Guardado.datos.stats.aciertos < 6 || dif === 0;
    const toca = obj.g === 'f' ? 'Tócalas' : 'Tócalos';
    return {
      firma: 'c' + n + obj.e,
      respuesta: n,
      enunciado: '¿' + cuantos(obj) + ' ' + obj.p + ' hay?' + (consejo ? ' ' + toca + ' para contar.' : ''),
      refuerzo: 'Hay ' + cantidad(n, obj) + '.',
      pintar(esc, resp) {
        const zona = crear('div', 'zona');
        zona.appendChild(Render.rejilla(Array(n).fill(obj.e), { disperso: dif === 2, nombre: obj.s }));
        esc.appendChild(zona);
        opciones.forEach(v => resp.appendChild(Render.botonNumero(v)));

      pista(tk) {
        return Pistas.contar(tk, $$('#escena .obj'), {

        });

  },

  /* ----- Formas geométricas ----- */
  formas(dif) {
    const grupos = [
      ['circulo', 'cuadrado', 'triangulo'],
      ['circulo', 'cuadrado', 'triangulo', 'rectangulo', 'estrella', 'corazon'],
      Object.keys(FORMAS)
    ];
    const cuantas = dif === 2 ? 4 : 3;
    const elegidas = barajar(grupos[dif]).slice(0, cuantas);
    const obj = elegir(elegidas);
    const info = FORMAS[obj];
    const colores = barajar(COLORES_FORMA);
    const giratorias = ['triangulo', 'rectangulo', 'estrella', 'corazon', 'ovalo'];
    const giros = elegidas.map(f => (dif === 2 && giratorias.indexOf(f) >= 0) ? azar(-30, 30) : 0);
    const escalas = elegidas.map(() => dif === 2 ? azar(72, 100) / 100 : 1);
    return {
      firma: 'f' + obj + elegidas.join(''),
      respuesta: obj,
      sinRespuestas: true,
      enunciado: 'Toca ' + articuloEl(info.g) + ' ' + info.n + '.',
      refuerzo: 'Es ' + articuloUn(info.g) + ' ' + info.n + '. ' + info.dato,
      pintar(esc) {
        const zona = crear('div', 'zona');
        const c = Render.cartas(1, 260);
        elegidas.forEach((f, i) => c.appendChild(Render.carta(f, formaSVG(f, colores[i % colores.length], giros[i], escalas[i]), FORMAS[f].n)));
        zona.appendChild(c);
        esc.appendChild(zona);
      },
      pista() {
        Pistas.tira(formaSVG(obj, '#9B7BF7', 0, 1, true).replace('class="forma"', 'class="forma forma-pista"'));
        Pistas.quitarUna();
        return Voz.decir(elegir(ANIMOS) + ' ' + capitalizar(articuloEl(info.g)) + ' ' + info.n + ' es así. ' + info.dato);
      }
    };
  },

  /* ----- Reconocer números del 1 al 10 ----- */
  numeros(dif) {
    const tocaNumero = dif === 0 ? Math.random() < 0.6 : Math.random() < 0.5;
    if (!tocaNumero) return genGrupoNumero(dif);
    if (dif === 0) return genTocaNumero(1, 5, 3, true, false);
    if (dif === 1) return genTocaNumero(1, 10, 3, false, false);
    return genTocaNumero(1, 10, 4, false, true);
  },

  /* ----- Números hasta 20 (marcos de diez) ----- */
  veinte(dif) {
    const max = [13, 16, 20][dif];
    if (Math.random() < 0.55) {
      const n = azar(11, max);
      const extra = n - 10;
      const obj = elegir(OBJETOS);

      return {
        firma: 'v' + n + obj.e,
        respuesta: n,
        enunciado: '¿' + cuantos(obj) + ' ' + obj.p + ' hay en total? La primera caja tiene diez.',
        refuerzo: 'Diez y ' + numTexto(extra) + ' son ' + numTexto(n) + '.',
        pintar(esc, resp) {
          const marcos = crear('div', 'marcos');
          marcos.dataset.ajustar = 'marcos';
          [10, extra].forEach(lleno => {

            for (let i = 0; i < 10; i++) {

          opciones.forEach(v => resp.appendChild(Render.botonNumero(v)));

        pista(tk) {
          const ms = $$('#escena .marco');
          return Pistas.contar(tk, $$('.obj', ms[1]), {
            intro: elegir(ANIMOS),
            previos: $$('.obj', ms[0]),
            marcoPrevio: ms[0],
            textoPrevio: 'Esta caja está llena: tiene diez. Seguimos contando desde el diez.',
            cierre: '¿' + cuantos(obj) + ' hay en total? ¡Toca la respuesta!'
          });
        }
      };
    }
    return genTocaNumero(11, max, dif === 2 ? 4 : 3, false, false);
  },

  /* ----- Comparar: más, menos o igual ----- */
  comparar(dif) {
    const obj = elegir(OBJETOS);
    const max = [5, 8, 10][dif];
    const igual = dif === 2 && Math.random() < 0.3;
    let a, b;
    if (igual) {
      a = b = azar(2, max);
    } else {
      do { a = azar(1, max); b = azar(1, max); } while (Math.abs(a - b) < (dif === 0 ? 2 : 1));
    }
    const pide = dif === 0 ? 'mas' : elegir(['mas', 'menos']);
    const respuesta = igual ? 'igual' : (pide === 'mas' ? (a > b ? 'izq' : 'der') : (a < b ? 'izq' : 'der'));
    const mayor = Math.max(a, b), menor = Math.min(a, b);
    let refuerzo;
    if (igual) refuerzo = '¡Hay igual en los dos lados: ' + numTexto(a) + ' y ' + numTexto(b) + '!';
    else if (pide === 'mas') refuerzo = 'Aquí hay ' + cantidad(mayor, obj) + ', y ' + numTexto(mayor) + ' es más que ' + numTexto(menor) + '.';
    else refuerzo = 'Aquí hay ' + cantidad(menor, obj) + ', y ' + numTexto(menor) + ' es menos que ' + numTexto(mayor) + '.';
    return {
      firma: 'm' + a + '-' + b + pide,
      respuesta: respuesta,
      sinRespuestas: dif < 2,
      enunciado: '¿Dónde hay ' + (pide === 'mas' ? 'más' : 'menos') + ' ' + obj.p + '?' + (dif === 2 ? ' Si hay igual en los dos lados, toca el igual.' : ''),
      refuerzo: refuerzo,
      pintar(esc, resp) {
        const comp = crear('div', 'comparar');
        [['izq', a], ['der', b]].forEach(par => {
          const p = crear('button', 'panel elegible');
          p.type = 'button';
          p.dataset.valor = par[0];
          p.setAttribute('aria-label', (par[0] === 'izq' ? 'Lado izquierdo' : 'Lado derecho'));
          p.appendChild(Render.rejilla(Array(par[1]).fill(obj.e), { contable: false, nombre: obj.s }));
          const cuenta = crear('div', 'panel-cuenta', String(par[1]));
          cuenta.hidden = true;
          p.appendChild(cuenta);
          p.addEventListener('click', () => Juego.responder(par[0], p));
          comp.appendChild(p);
        });
        esc.appendChild(comp);
        if (dif === 2) {
          const bi = crear('button', 'btn opcion elegible btn-igual', '=');
          bi.type = 'button';
          bi.dataset.valor = 'igual';
          bi.setAttribute('aria-label', 'Igual');
          bi.addEventListener('click', () => Juego.responder('igual', bi));
          resp.appendChild(bi);
        }
      },
      pista(tk) {
        const paneles = $$('#escena .panel');
        paneles.forEach(p => { const c = p.querySelector('.panel-cuenta'); if (c) c.hidden = false; });
        Render.ajustar();
        const cierre = igual ? '¿Hay más en algún lado, o hay igual?' : (pide === 'mas' ? '¿Dónde hay más?' : '¿Dónde hay menos?');
        return Pistas.leer(tk, [
          { el: paneles[0], texto: 'Aquí hay ' + cantidad(a, obj) + '.' },
          { el: paneles[1], texto: 'Y aquí hay ' + cantidad(b, obj) + '.' }
        ], cierre, elegir(ANIMOS) + ' Vamos a contar cada lado.');
      }
    };
  },

  /* ----- Secuencias: el tren de números ----- */
  secuencias(dif) {
    let k = 5, inicio, paso = 1, falta;
    if (dif === 0) { k = 4; inicio = azar(1, 3); falta = k - 1; }
    else if (dif === 1) { inicio = azar(1, 6); falta = azar(1, k - 1); }
    else if (Math.random() < 0.5) { inicio = azar(6, 16); falta = azar(1, k - 1); }
    else { paso = -1; inicio = azar(5, 10); falta = azar(1, k - 1); }
    const nums = rango(0, k - 1).map(i => inicio + i * paso);
    const resp = nums[falta];
    const opciones = opcionesCercanas(resp, 1, 20, 3);
    const antes = nums[falta - 1], despues = nums[falta + 1];
    const refuerzo = despues === undefined
      ? 'Después del ' + numTexto(antes) + ' viene el ' + numTexto(resp) + '.'
      : 'Entre el ' + numTexto(antes) + ' y el ' + numTexto(despues) + ' va el ' + numTexto(resp) + '.';
    return {
      firma: 's' + nums.join('-') + '/' + falta,
      respuesta: resp,
      enunciado: paso < 0 ? '¡Cuenta atrás del cohete! ¿Qué número falta?' : '¿Qué número falta en el tren?',
      refuerzo: refuerzo,
      pintar(esc, respC) {
        const tren = crear('div', 'tren');
        tren.dataset.ajustar = 'tren';
        const cabeza = crear('span', 'locomotora', paso < 0 ? '🚀' : '🚂');
        if (paso > 0) tren.appendChild(cabeza);
        nums.forEach((v, i) => {
          const w = crear('div', 'vagon' + (i === falta ? ' hueco' : ''),
            i === falta ? '<span>?</span>' : '<b>' + v + '</b>' + (dif === 0 ? puntosHTML(v) : ''));
          tren.appendChild(w);
        });
        if (paso < 0) tren.appendChild(cabeza);
        esc.appendChild(tren);
        opciones.forEach(v => respC.appendChild(Render.botonNumero(v)));
      },
      pista(tk) {
        const vagones = $$('#escena .vagon');
        const pasos = nums.map((v, i) => ({ el: vagones[i], texto: i === falta ? '¿Cuál?' : capitalizar(numTexto(v)) }));
        return Pistas.leer(tk, pasos, '¿Qué número va en el hueco?', elegir(ANIMOS) + ' Vamos a leer el tren.');
      }
    };
  },

  /* ----- Sumas hasta 10 con objetos ----- */
  sumas(dif) {
    const lim = [[2, 5], [3, 7], [5, 10]][dif];
    const total = azar(lim[0], lim[1]);
    const a = azar(1, total - 1);
    const b = total - a;
    const obj = elegir(OBJETOS);
    const plantillas = [
      () => 'Hay ' + cantidad(a, obj) + '. Llega' + (b > 1 ? 'n ' : ' ') + cantidad(b, obj) + ' más. ¿' + cuantos(obj) + ' hay ahora?',
      () => 'Pipo tiene ' + cantidad(a, obj) + ' y encuentra ' + cantidad(b, obj) + ' más. ¿' + cuantos(obj) + ' tiene ahora?'
    ];
    const opciones = opcionesCercanas(total, 1, 10, 3);
    return {
      firma: 'a' + a + '+' + b,
      respuesta: total,
      enunciado: elegir(plantillas)(),
      refuerzo: capitalizar(numTexto(a)) + ' y ' + numTexto(b) + ' son ' + numTexto(total) + '.',
      pintar(esc, resp) {
        const op = crear('div', 'operacion');
        const g1 = crear('div', 'grupo');
        g1.appendChild(Render.rejilla(Array(a).fill(obj.e), { nombre: obj.s }));
        const g2 = crear('div', 'grupo');
        g2.appendChild(Render.rejilla(Array(b).fill(obj.e), { nombre: obj.s }));
        // El grupo pequeño no se estrecha demasiado: sus objetos siguen siendo fáciles de tocar
        g1.style.flexGrow = Math.max(a, 3);
        g2.style.flexGrow = Math.max(b, 3);
        op.appendChild(g1);
        op.appendChild(crear('span', 'signo-op', '+'));
        op.appendChild(g2);
        esc.appendChild(op);
        esc.appendChild(crear('div', 'ecuacion', '<span>' + a + '</span><span class="signo-mas">+</span><span>' + b + '</span><span>=</span><span class="q">?</span>'));
        opciones.forEach(v => resp.appendChild(Render.botonNumero(v)));
      },
      pista(tk) {
        return Pistas.contar(tk, $$('#escena .obj'), {
          intro: elegir(ANIMOS) + (obj.g === 'f' ? ' Contamos todas juntas.' : ' Contamos todos juntos.'),
          cierre: '¿' + cuantos(obj) + ' hay en total? ¡Toca la respuesta!'
        });
      }
    };
  },

  /* ----- Restas hasta 10: algunas cosas se van ----- */
  restas(dif) {
    const lim = [[2, 5, 2], [4, 7, 3], [5, 10, 5]][dif];
    const n = azar(lim[0], lim[1]);
    const k = azar(1, Math.min(lim[2], n - 1));
    const quedan = n - k;
    const tema = elegir(ESCENAS_RESTA);
    const p1 = 'Hay ' + cantidad(n, tema) + '.';
    const p2 = (k === 1 ? tema.uno : tema.varios(numTexto(k))) + ' ¿' + cuantos(tema) + ' quedan?';
    const opciones = opcionesCercanas(quedan, 1, 10, 3);
    let quitados = false;
    const quitar = () => {
      if (quitados) return;
      quitados = true;
      const objs = $$('#escena .obj');
      objs.slice(objs.length - k).forEach((o, i) => {
        setTimeout(() => {
          Render.desmarcar(o);
          o.classList.add('se-va');
        }, i * 140);
      });
      Sonido.efecto(tema.e === '🚀' ? 'cohete' : 'pagina');
    };
    const q = {
      firma: 'r' + n + '-' + k + tema.e,
      respuesta: quedan,
      enunciado: p1 + ' ' + p2,
      refuerzo: 'Quedan ' + cantidad(quedan, tema) + '. ' + capitalizar(numTexto(n)) + ' menos ' + numTexto(k) + ' son ' + numTexto(quedan) + '.',
      pintar(esc, resp) {
        const zona = crear('div', 'zona');
        zona.appendChild(Render.rejilla(Array(n).fill(tema.e), { nombre: tema.s }));
        esc.appendChild(zona);
        esc.appendChild(crear('div', 'ecuacion', '<span>' + n + '</span><span class="signo-menos">−</span><span>' + k + '</span><span>=</span><span class="q">?</span>'));
        opciones.forEach(v => resp.appendChild(Render.botonNumero(v)));
      },
      /* Primero se ven todos; al terminar la primera frase, se van algunos */
      hablar(tk, enCola) {
        Voz.decir(p1, { cola: enCola }).then(() => {
          if (Juego.estado.pregunta !== q) return;
          quitar();
          return esperar(500).then(() => {
            if (tk === Juego.token && !Juego.pausado && Juego.estado.pregunta === q) Voz.decir(p2, { cola: true });
          });
        });
        // Seguridad: si la voz se retrasa, se van igualmente
        setTimeout(() => { if (Juego.estado.pregunta === q) quitar(); }, 7000);
      },
      pista(tk) {
        quitar();
        return esperar(150 * k).then(() => Pistas.contar(tk, $$('#escena .obj:not(.se-va)'), {
          intro: elegir(ANIMOS) + (tema.g === 'f' ? ' Contamos las que quedan.' : ' Contamos los que quedan.'),
          cierre: '¿' + cuantos(tema) + ' quedan? ¡Toca la respuesta!'
        }));
      }
    };
    return q;
  },

  /* ----- Patrones: ¿qué va después? ----- */
  patrones(dif) {
    const set = barajar(elegir(PATRON_SETS));
    let unidad;
    if (dif === 0) unidad = [0, 1];
    else if (dif === 1) unidad = elegir([[0, 0, 1], [0, 1, 1]]);
    else unidad = elegir([[0, 1, 2], [0, 0, 1, 1]]);
    const piezas = unidad.map(i => set[i]);
    const largo = dif === 0 ? azar(4, 5) : (unidad.length === 3 ? azar(5, 7) : azar(6, 7));
    const fila = rango(0, largo - 1).map(i => piezas[i % unidad.length]);
    const resp = piezas[largo % unidad.length];
    const distintos = [];
    piezas.forEach(p => { if (distintos.indexOf(p) < 0) distintos.push(p); });
    const extra = set.filter(p => distintos.indexOf(p) < 0);
    let opciones = distintos.slice();
    while (opciones.length < 3 && extra.length) opciones.push(extra.shift());
    opciones = barajar(opciones.slice(0, 3));
    return {
      firma: 'p' + fila.map(x => x.e).join(''),
      respuesta: resp.e,
      enunciado: '¿Qué va después? Mira la fila.',
      refuerzo: 'Va ' + articuloUn(resp.g) + ' ' + resp.n + '.',
      pintar(esc, respC) {
        const f = crear('div', 'fila');
        f.dataset.ajustar = 'fila';
        fila.forEach(p => f.appendChild(crear('div', 'pat', p.e)));
        f.appendChild(crear('div', 'pat hueco', '<span>?</span>'));
        esc.appendChild(f);
        opciones.forEach(p => respC.appendChild(Render.botonEmoji(p.e, p.e, p.n)));
      },
      pista(tk) {
        const pats = $$('#escena .pat');
        pats.forEach((p, i) => { if (i < largo) p.classList.add('u' + (Math.floor(i / unidad.length) % 2)); });
        const pasos = fila.map((p, i) => ({ el: pats[i], texto: capitalizar(p.n) }));
        pasos.push({ el: pats[largo], texto: '¿Y ahora?' });
        return Pistas.leer(tk, pasos, '¿Qué va en el hueco?', elegir(ANIMOS) + ' Mira los colores: así se repite la fila.');
      }
    };
  }
};

  const W = cont.clientWidth, H = cont.clientHeight;
  if (!W || !H) return;
  const m = medirRejilla(W, H, cont.children.length, 1, 10);
  const lado = Math.min(m.alto, 132);
  cont.style.setProperty('--cols', m.cols);
  cont.style.setProperty('--cw', lado + 'px');
  cont.style.setProperty('--ch', lado + 'px');
  cont.style.setProperty('--g', '10px');
}

    this.pintar();

    $$('#p-tienda .pestana').forEach(b => {
      const activa = b.dataset.tab === this.pestana;
      b.classList.toggle('activa', activa);
      b.setAttribute('aria-selected', activa ? 'true' : 'false');
    });
    const cont = $('#tiendaItems');
    cont.innerHTML = '';
    const d = Guardado.datos;
    const esColor = this.pestana === 'colores';
    const lista = esColor ? COLORES_PIPO : ACCESORIOS;
    const poseidos = esColor ? d.tienda.colores : d.tienda.accesorios;
    lista.forEach(it => {
      const tiene = poseidos.indexOf(it.id) >= 0;
      const puesto = esColor ? d.pipo.color === it.id : d.pipo.acc === it.id;
      const aspecto = esColor ? { color: it.id } : { acc: it.id };
      const b = crear('button', 'btn item' + (puesto ? ' equipado' : '') + (!tiene && it.precio > d.monedas ? ' caro' : ''));
      b.type = 'button';
      b.innerHTML = '<span class="mini">' + Mascota.html(aspecto) + '</span>' +
        '<span class="precio">' + (tiene ? '<span class="ico">' + ICONOS.check + '</span>' : '<span class="emo">🪙</span>' + it.precio) + '</span>';
      b.setAttribute('aria-label', it.n + (tiene ? '' : ', cuesta ' + it.precio + ' monedas'));
      b.addEventListener('click', () => this.tocar(it, b));
      cont.appendChild(b);
    });
  },

  tocar(it, b) {
    const d = Guardado.datos;
    const esColor = this.pestana === 'colores';
    const poseidos = esColor ? d.tienda.colores : d.tienda.accesorios;
    let compra = false;
    if (poseidos.indexOf(it.id) < 0) {
      if (d.monedas < it.precio) {
        Sonido.efecto('no');
        b.classList.remove('sin-dinero');
        void b.offsetWidth;
        b.classList.add('sin-dinero');

        return;
      }
      d.monedas -= it.precio;
      poseidos.push(it.id);
      compra = true;
      Sonido.efecto('comprar');
      const c = UI.centro(b);
      Confeti.lanzar(c.x, c.y, 40, false);
    } else {
      Sonido.efecto('toque');
    }
    if (esColor) d.pipo.color = it.id; else d.pipo.acc = it.id;
    Guardado.guardar();
    Mascota.actualizarTodas();
    UI.actualizarMonedas();
    this.pintar();
    Mascota.animar('feliz');
    let texto = esColor ? '¡Pipo ahora es de color ' + it.n + '!' : (it.id === 'ninguno' ? 'Pipo sin nada en la cabeza.' : '¡Qué bien le queda ' + it.n + '!');
    if (compra) texto = '¡Nuevo! ' + texto;
    Logros.comprobar().forEach(l => { texto += ' ¡Nueva medalla! ' + l.voz; });
    Voz.decir(texto);
  }
};

/* ----- Botón de padres: hay que mantenerlo pulsado 3 segundos ----- */
function prepararBotonPadres() {
  const b = $('#btnPadres');
  const anillo = $('.anillo-carga circle', b);
  const LARGO = 289.03;
  const DURACION = 3000;
  let inicio = 0, raf = 0, activo = false, abierto = false;
  const pintar = p => { anillo.style.strokeDashoffset = String(LARGO * (1 - p)); };
  const paso = () => {
    if (!activo) return;
    const p = Math.min(1, (performance.now() - inicio) / DURACION);
    pintar(p);
    if (p >= 1) {
      activo = false;
      abierto = true;
      pintar(0);
      Sonido.efecto('pagina');
      Padres.abrir();
    } else {
      raf = requestAnimationFrame(paso);
    }
  };
  const empezar = ev => {
    if (ev && ev.cancelable) ev.preventDefault();
    if (activo) return;
    activo = true;
    abierto = false;
    inicio = performance.now();
    if (ev && ev.pointerId !== undefined) { try { b.setPointerCapture(ev.pointerId); } catch (e) { /* sin captura */ } }
    raf = requestAnimationFrame(paso);
  };
  const soltar = () => {
    if (!activo) return;
    activo = false;
    cancelAnimationFrame(raf);
    pintar(0);
    if (!abierto) UI.aviso('👨‍👩‍👧', 'Padres: mantén pulsado 3 segundos');
  };
  if (window.PointerEvent) {
    b.addEventListener('pointerdown', empezar);
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => b.addEventListener(n, soltar));
  } else {
    b.addEventListener('touchstart', empezar, { passive: false });
    b.addEventListener('mousedown', empezar);
    ['touchend', 'touchcancel', 'mouseup', 'mouseleave'].forEach(n => b.addEventListener(n, soltar));
  }
  b.addEventListener('keydown', ev => { if ((ev.key === 'Enter' || ev.key === ' ') && !ev.repeat) empezar(ev); });
  b.addEventListener('keyup', ev => { if (ev.key === 'Enter' || ev.key === ' ') soltar(); });
  b.addEventListener('click', ev => ev.preventDefault());
  b.addEventListener('contextmenu', ev => ev.preventDefault());
}

const NOMBRE_DIF = ['Fácil', 'Media', 'Difícil'];

const Padres = {
  confirmando: false,
  tConfirmar: null,

  abrir() {
    Voz.callar();
    $('#c-padres').hidden = false;
    this.pintar();
    const panel = $('.panel-padres');
    if (panel) panel.scrollTop = 0;

    this.confirmando = false;
    clearTimeout(this.tConfirmar);
    UI.actualizarMonedas();
    if (UI.pantalla === 'p-mapa') Mapa.distribuir();
  },

  pintar() {
    const d = Guardado.datos;
    const a = d.ajustes;
    const pct = d.stats.aciertos ? Math.round(d.stats.primera / d.stats.aciertos * 100) : 0;
    const vecesTotal = NIVELES.reduce((s, n) => s + ((d.niveles[n.id] && d.niveles[n.id].completado) || 0), 0);
    const fila = (etiqueta, control) => '<div class="pp-fila"><label>' + etiqueta + '</label>' + control + '</div>';
    const interruptor = clave => '<button type="button" class="interruptor" role="switch" aria-checked="' + (a[clave] ? 'true' : 'false') + '" data-ajuste="' + clave + '" aria-label="' + clave + '"></button>';
    const deslizador = (clave, min, max, paso) => '<input type="range" min="' + min + '" max="' + max + '" step="' + paso + '" value="' + a[clave] + '" data-ajuste="' + clave + '">';

    let tabla = '<table class="pp-tabla"><thead><tr><th>Planeta</th><th>Terminado</th><th>Aciertos</th><th>A la primera</th><th>Nivel</th></tr></thead><tbody>';
    NIVELES.forEach((n, i) => {
      const r = d.niveles[n.id];
      const abierto = a.desbloquearTodo || i < d.desbloqueados;
      tabla += '<tr><td>' + (i + 1) + '. ' + n.nombre + (abierto ? '' : ' 🔒') + '</td><td>' + (r ? r.completado : 0) + ' ×</td><td>' + (r ? r.aciertos : 0) +
        '</td><td>' + (r && r.aciertos ? Math.round(r.primera / r.aciertos * 100) + ' %' : '—') + '</td><td>' + NOMBRE_DIF[r ? r.dif : 0] + '</td></tr>';
    });
    tabla += '</tbody></table>';

    const dato = (titulo, valor) => '<div class="pp-dato"><b>' + valor + '</b>' + titulo + '</div>';
    const html =
      '<section class="pp-seccion"><h3>Voz de Pipo</h3><div class="pp-voces" id="ppVoces"></div>' +
      '<p class="pp-nota">Voces en español detectadas en este aparato: ' + Voz.es.length + '. ' +
      (Voz.es.length < 3 ? 'Como hay menos de tres, los personajes se diferencian cambiando el tono y la velocidad.' : 'Cada personaje usa una voz distinta.') +
      (!Voz.soportada ? ' Este navegador no puede hablar: se mostrarán subtítulos.' : '') + '</p></section>' +

      '<section class="pp-seccion"><h3>Sonido</h3>' +
      fila('Música', interruptor('musica')) +
      fila('Volumen de la música', deslizador('volMusica', 0, 1, 0.05)) +
      fila('Voz de Pipo', interruptor('voz')) +
      fila('Volumen de la voz', deslizador('volVoz', 0, 1, 0.05)) +
      fila('Velocidad de la voz', deslizador('velocidad', 0.6, 1.2, 0.05)) +
      fila('Volumen de los efectos', deslizador('volEfectos', 0, 1, 0.05)) +
      '<p class="pp-nota">Si la voz está apagada, Pipo muestra lo que dice en un bocadillo.</p></section>' +

      '<section class="pp-seccion"><h3>Descanso sugerido</h3><div class="segmentos">' +
      [0, 10, 15, 20].map(m => '<button type="button" class="seg' + (a.descansoMin === m ? ' activo' : '') + '" data-descanso="' + m + '">' + (m ? m + ' min' : 'No') + '</button>').join('') +
      '</div><p class="pp-nota">Tras ese tiempo de juego, Pipo propone parar, estirarse y beber agua. El niño puede elegir seguir un poco más.</p></section>' +

      '<section class="pp-seccion"><h3>Progreso</h3><div class="pp-resumen">' +
      dato('aciertos', d.stats.aciertos) +
      dato('a la primera', pct + ' %') +
      dato('planetas distintos', planetasDistintos(d) + '/' + NIVELES.length) +
      dato('planetas jugados', vecesTotal) +
      dato('días de aventura', d.dias.total) +
      dato('días seguidos', d.dias.racha) +
      dato('minutos de juego', Math.round(d.stats.minutos)) +
      dato('monedas', d.monedas) +
      dato('pegatinas', d.pegatinas.length + '/' + PEGATINAS.length) +
      dato('medallas', d.logros.length + '/' + LOGROS.length) +
      '</div>' + tabla +
      '<p class="pp-nota">La dificultad de cada planeta se ajusta sola: sube tras 3 aciertos seguidos a la primera y baja si hay un fallo. La racha de días perdona un día sin jugar.</p></section>' +

      '<section class="pp-seccion"><h3>Opciones</h3>' +
      fila('Desbloquear todos los planetas', interruptor('desbloquearTodo')) +
      fila('Borrar monedas, pegatinas, medallas y planetas (se conservan voz y sonido)',
        '<button type="button" class="btn-texto-pp btn-peligro" id="ppReiniciar">Reiniciar progreso</button>') +
      '</section>' +

      '<section class="pp-seccion"><h3>Privacidad</h3><p class="pp-nota">Sin anuncios, sin compras y sin enlaces externos. No se envía ningún dato a ningún sitio: el progreso se guarda solo en este navegador.</p>' +
      (Guardado.disponible ? '' : '<div class="pp-aviso">Este navegador no permite guardar (¿modo privado?). El progreso se perderá al cerrar la página.</div>') +
      '</section>';

    const cont = $('#padresContenido');
    cont.innerHTML = html;

    // Tarjetas de voz
    const voces = $('#ppVoces');
    PERFILES_VOZ.forEach((p, i) => {
      voces.appendChild(tarjetaVoz(i, d.vozElegida === i || (d.vozElegida === null && i === 1), () => {
        d.vozElegida = i;
        Guardado.guardar();
        Voz.decir(p.saludo, { perfil: i });
        this.pintar();
      }, Voz.describir(i)));
    });

    // Interruptores
    $$('.interruptor', cont).forEach(el => el.addEventListener('click', () => {
      const clave = el.dataset.ajuste;
      a[clave] = !a[clave];
      el.setAttribute('aria-checked', a[clave] ? 'true' : 'false');
      Guardado.guardar();
      if (clave === 'musica') { Sonido.actualizarMusica(); Pausa.pintarMusica(); }
      if (clave === 'voz') { Voz.callar(); Voz.avisar(); if (a.voz) Voz.decir('¡Hola! Ya puedo hablar.'); }
      if (clave === 'desbloquearTodo') this.pintar();
    }));

    // Deslizadores
    $$('input[type=range]', cont).forEach(el => {
      el.addEventListener('input', () => {
        a[el.dataset.ajuste] = Number(el.value);
        Sonido.aplicarVolumen();
        Guardado.guardarLuego();
      });
      el.addEventListener('change', () => {
        const clave = el.dataset.ajuste;
        if (clave === 'volVoz' || clave === 'velocidad') Voz.decir('Así hablo yo.');
        if (clave === 'volEfectos') Sonido.efecto('acierto');
      });
    });

    // Descanso
    $$('[data-descanso]', cont).forEach(el => el.addEventListener('click', () => {
      a.descansoMin = Number(el.dataset.descanso);
      Guardado.guardar();
      this.pintar();
    }));

    // Reiniciar (doble confirmación sin ventanas emergentes)
    const reiniciar = $('#ppReiniciar');
    if (this.confirmando) { reiniciar.classList.add('confirmar'); reiniciar.textContent = 'Pulsa otra vez para borrar todo'; }
    reiniciar.addEventListener('click', () => {
      if (!this.confirmando) {
        this.confirmando = true;
        reiniciar.classList.add('confirmar');
        reiniciar.textContent = 'Pulsa otra vez para borrar todo';
        clearTimeout(this.tConfirmar);
        this.tConfirmar = setTimeout(() => {
          this.confirmando = false;
          reiniciar.classList.remove('confirmar');
          reiniciar.textContent = 'Reiniciar progreso';
        }, 4000);
        return;
      }
      this.confirmando = false;
      clearTimeout(this.tConfirmar);
      Guardado.reiniciar();
      Mapa.ultimo = null;
      Mascota.actualizarTodas();
      UI.actualizarMonedas();
      this.pintar();
      UI.aviso('🧹', 'Progreso reiniciado');
    });
  }
};

/* =========================================================
   13. ARRANQUE Y EVENTOS GLOBALES
   ========================================================= */

/* Altura real de la ventana (las barras del navegador móvil cambian de tamaño) */
function ajustarAltura() {
  document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
}

/* Recoloca lo que depende del tamaño de pantalla */
function reajustar() {
  ajustarAltura();
  if (UI.pantalla === 'p-mapa') Mapa.distribuir();
  if (UI.pantalla === 'p-juego') Render.ajustar();
  if (UI.pantalla === 'p-album') ajustarColeccion($('#albumRejilla'));
  if (UI.pantalla === 'p-logros') ajustarColeccion($('#logrosRejilla'));
  if (Confeti.activo) Confeti.ajustar();
}

function enlazarEventos() {
  const al = (sel, fn) => { const el = $(sel); if (el) el.addEventListener('click', fn); };

  al('#btnJugar', () => Inicio.jugar());
  al('#btnVozOk', () => SelectorVoz.confirmar());
  al('#btnRepetir', () => { Sonido.efecto('toque'); Voz.repetir(); });
  al('#btnPausa', () => { Sonido.efecto('toque'); Juego.pausar(); });
  al('#btnSeguir', () => { Sonido.efecto('toque'); Pausa.cerrar(); Juego.reanudar(); });
  al('#btnIrMapa', () => { Sonido.efecto('pagina'); Pausa.cerrar(); Juego.salir(); });
  al('#btnMusicaPausa', () => Pausa.alternarMusica());
  al('#btnRegalo', () => Premio.abrirRegalo());
  al('#btnPremioSeguir', () => Premio.seguir());
  al('#btnTienda', () => Tienda.abrir());
  al('#btnAlbum', () => Album.abrir());
  al('#btnLogros', () => Logros.abrir());
  al('#btnDescansar', () => Descanso.descansar());
  al('#btnSeguirJugando', () => Descanso.seguir());
  al('#btnCerrarPadres', () => Padres.cerrar());
  $$('.btn-volver').forEach(b => b.addEventListener('click', () => {
    Sonido.efecto('pagina');
    Mapa.abrir({ texto: '¡Elige un planeta!' });
  }));
  $$('#p-tienda .pestana').forEach(b => b.addEventListener('click', () => Tienda.cambiarPestana(b.dataset.tab)));

  // Cambios de tamaño y de orientación
  let t = null;
  const alCambiar = () => { clearTimeout(t); t = setTimeout(reajustar, 120); };
  window.addEventListener('resize', alCambiar);
  window.addEventListener('orientationchange', alCambiar);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', alCambiar);

  // Al salir de la pestaña: silencio y pausa; al volver, el audio sigue
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      Voz.callar();
      Sonido.suspender();
      if (UI.pantalla === 'p-juego' && !Juego.pausado && !Juego.bloqueado) {
        Juego.pausado = true;
        Juego.tPausa = Date.now();
        Juego.token++;
        Pausa.abrir(true);
      }
      Guardado.guardar();
    } else {
      Sonido.reanudar();
    }
  });
  window.addEventListener('pagehide', () => Guardado.guardar());

  // Sin zoom por gestos ni doble toque, sin menús de pulsación larga
  document.addEventListener('gesturestart', ev => ev.preventDefault(), { passive: false });
  document.addEventListener('dblclick', ev => ev.preventDefault(), { passive: false });
  document.addEventListener('contextmenu', ev => {
    if (!(ev.target.closest && ev.target.closest('.panel-padres'))) ev.preventDefault();
  });
  document.addEventListener('touchmove', ev => {
    if (ev.touches && ev.touches.length > 1) { ev.preventDefault(); return; }
    if (!(ev.target.closest && ev.target.closest('.desplazable'))) ev.preventDefault();
  }, { passive: false });
}

function iniciarApp() {
  Guardado.cargar();
  pintarIconos(document);
  crearCielo();
  Mascota.actualizarTodas();
  UI.actualizarMonedas();
  ajustarAltura();
  try {
    Voz.iniciar();
  } catch (e) {
    // Si la voz falla al arrancar, el juego sigue con subtítulos
    Voz.soportada = false;
    Voz.revisada = true;
  }
  prepararBotonPadres();
  enlazarEventos();
  UI.mostrar('p-inicio');
}

iniciarApp();

</script>
